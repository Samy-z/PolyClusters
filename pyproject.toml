[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyclusters"
version = "1.0.0"
description = "Desktop cluster analysis of concordant high-stake Polymarket wallets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "networkx>=3.3",
    "httpx>=0.27",
    "pyqtgraph>=0.13",
    "truststore>=0.9; python_version >= '3.10'",
]

[project.scripts]
polyclusters = "polyclusters.__main__:main"

[project.optional-dependencies]
package = ["pyinstaller>=6.6"]

[tool.setuptools.packages.find]
include = ["polyclusters*"]
